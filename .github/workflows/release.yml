name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare matrix
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./docker/build.sh --emit-github-matrix \
            --release "$RELEASE_TAG" \
            --registry forgejo.alexlab.nl/alexlab \
            --platform linux/arm64 \
            --no-latest

  publish:
    name: Publish ${{ matrix.image_name }}
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to Forgejo
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: forgejo.alexlab.nl
          username: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ matrix.image }}
          build-args: |
            APP_VERSION=${{ matrix.app_version }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
      - name: Record published digest
        run: |
          printf 'Image: %s\nDigest: %s\n' \
            '${{ matrix.image }}' \
            '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of Forgejo
        if: always()
        run: docker logout forgejo.alexlab.nl
