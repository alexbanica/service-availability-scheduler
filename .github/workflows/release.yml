name: Publish Docker images
run-name: Publish Docker images for ${{ github.ref_name }}

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Docker image publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare Docker image matrix
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./docker/build.sh --emit-github-matrix \
            --release "$RELEASE_TAG" \
            --registry forgejo.alexlab.nl/alexlab \
            --platform linux/arm64 \
            --no-latest

  publish:
    name: Build and push Docker image (${{ matrix.image_name }})
    needs: prepare-release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Log in to Forgejo container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: forgejo.alexlab.nl
          username: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
      - name: Build and push Docker image
        env:
          APP_VERSION: ${{ matrix.app_version }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(uname -m)" = "aarch64"
          test "$PLATFORM" = "linux/arm64"
          docker build \
            --platform "$PLATFORM" \
            --file "$DOCKERFILE" \
            --build-arg "APP_VERSION=$APP_VERSION" \
            --tag "$IMAGE" \
            "$BUILD_CONTEXT"
          docker push "$IMAGE"
          PUBLISHED_DIGEST="$(docker image inspect \
            --format '{{ index .RepoDigests 0 }}' \
            "$IMAGE")"
          test -n "$PUBLISHED_DIGEST"
          printf 'Image: %s\nDigest: %s\n' \
            "$IMAGE" \
            "$PUBLISHED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of Forgejo container registry
        if: always()
        run: docker logout forgejo.alexlab.nl
